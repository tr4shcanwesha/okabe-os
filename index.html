<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OBAKE-OS</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="wordle/wordle.css">
</head>
<body>

<div id="desktop"></div>
<div id="startmenu"></div>

<div id="taskbar">
  <div id="startbtn" class="raised" onclick="toggleStartMenu(event)">
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='6' height='6' fill='%23ff0000'/><rect x='9' y='1' width='6' height='6' fill='%2300aa00'/><rect x='1' y='9' width='6' height='6' fill='%230000ff'/><rect x='9' y='9' width='6' height='6' fill='%23ffcc00'/></svg>">
    Start
  </div>
  <div id="tb-sep"></div>
  <div id="tb-tasks"></div>
  <div id="clock" class="sunken">00:00 PM</div>
</div>

<!-- Core OS: window manager, desktop icons, start menu, file system, clock -->
<script src="script.js"></script>

<!-- Per-app folders: each icon's app lives in its own folder and registers
     itself with the core OS (addDesktopIcon, openWindow, etc.) once loaded.
     To add a new icon in future, drop a new folder here (e.g. /solitaire/)
     with its own .css/.js and add one more <script> line. -->
<script src="wordle/wordle.js"></script>

</body>
</html>
