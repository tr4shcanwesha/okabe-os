<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OKABE-OS</title>
  <link rel="icon" type="image/png" sizes="32x32" href="okabe-os-logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="wordle/wordle.css">
</head>
<link rel="stylesheet" href="boot/boot.css">
<script src="boot/boot.js" defer></script>
<body>

<div id="desktop"></div>
<div id="startmenu"></div>

<div id="taskbar">
  <div id="startbtn" class="raised" onclick="toggleStartMenu(event)">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6d/Windows_Logo_%281992-2001%29.svg" alt="Windows logo">
    Start
  </div>
  <div id="tb-sep"></div>
  <div id="tb-tasks"></div>
  <div id="clock" class="sunken">00:00 PM</div>
</div>

<!-- Core OS: window manager, desktop icons, file system, and clock -->
<script src="script.js"></script>
<script src="reset.js"></script>
<script src="filesystem.js"></script>
<script src="violate.js"></script>

<!-- Per-app folders: each icon's app lives in its own folder and registers
     itself with the core OS (addDesktopIcon, openWindow, etc.) once loaded.
     To add a new icon in future, drop a new folder here (e.g. /solitaire/)
     with its own .css/.js and add one more <script> line. -->
<script src="wordle/wordle.js"></script>

</body>
</html>
